    type: "problem database entry"
  - title: "Golomb's counterexample (JSP-000301; consecutive powerful numbers)"
    authors: ["Solomon W. Golomb"]
    id: "https://www.erdosproblems.com/latex/365"
    type: "problem database entry"

status:
  scope: >
    Complete formalization of Golomb's 1970 counterexample: 12167 = 23^3
    and 12168 = 2^3 * 3^2 * 13^2 are consecutive powerful numbers (every
    prime divisor occurs with exponent at least two), and neither is a
    perfect square since both lie strictly between 110^2 and 111^2.
    Disproves the universal claim that consecutive powerful numbers must
    include a perfect square.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "jsp_000301_answer"
      file: "Jsp000301/Basic.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "exists_consecutive_powerful_not_square"
      file: "Jsp000301/Basic.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

